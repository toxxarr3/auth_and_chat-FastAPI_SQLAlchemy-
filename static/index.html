<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Auth + Chat Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, Segoe UI, sans-serif;
      background: #f4f4f8;
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      background: white; padding: 30px; border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      width: 100%; max-width: 450px;
    }
    h2 { margin-bottom: 16px; color: #333; }
    h3 { margin: 20px 0 12px; color: #555; font-size: 16px; }
    form { margin-bottom: 20px; }
    label { display: block; font-size: 13px; color: #555; margin-bottom: 4px; }
    input {
      width: 100%; padding: 10px; margin-bottom: 12px;
      border: 1px solid #ddd; border-radius: 6px; font-size: 14px;
    }
    button {
      width: 100%; padding: 10px; background: #4f46e5; color: white;
      border: none; border-radius: 6px; font-size: 14px; cursor: pointer;
    }
    button:hover { background: #4338ca; }
    .output {
      background: #f9fafb; border-left: 3px solid #4f46e5;
      padding: 10px; font-size: 13px; color: #333;
      border-radius: 4px; white-space: pre-wrap; min-height: 40px;
      margin-top: 16px;
    }
    .error { border-left-color: #e11d48; color: #be123c; }
    hr { margin: 20px 0; border: none; border-top: 1px solid #eee; }
    
    /* Скрытие элементов */
    .hidden { display: none !important; }
    
    /* Chat styles */
    .chat-container { margin-top: 16px; }
    .room-input { display: flex; gap: 8px; margin-bottom: 8px; }
    .room-input input { margin-bottom: 0; flex: 1; }
    .room-input button { width: auto; padding: 10px 16px; }
    #chat-box {
      height: 250px; overflow-y: auto; background: #f9fafb;
      padding: 12px; border-radius: 6px; margin-bottom: 8px;
      font-size: 13px; border: 1px solid #e5e7eb;
    }
    .chat-msg { margin-bottom: 8px; padding: 6px 0; }
    .chat-msg b { color: #4f46e5; }
    .chat-msg small { color: #9ca3af; margin-left: 8px; }
    #msg-input { margin-bottom: 8px; }
    #send-btn { background: #10b981; }
    #send-btn:hover { background: #059669; }
    #logout-btn { background: #888; margin-top: 8px; }
    #logout-btn:hover { background: #666; }
    #me-btn { background: #f59e0b; margin-top: 8px; }
    #me-btn:hover { background: #d97706; }
    #disconnect-btn { background: #ef4444; margin-top: 8px; }
    #disconnect-btn:hover { background: #dc2626; }
  </style>
</head>
<body>
  <div class="container">
    <h2>🔐 Auth + Chat Demo</h2>

    <!-- Auth forms (скрываются после входа) -->
    <div id="auth-forms">
      <!-- Registration -->
      <h3>📝 Регистрация</h3>
      <form id="register-form">
        <label>Логин (3-50 символов)</label>
        <input name="username" type="text" required minlength="3" maxlength="50" placeholder="Ваш логин">
        <label>Пароль (мин. 6 символов)</label>
        <input name="password" type="password" required minlength="6" placeholder="Пароль">
        <button type="submit">Зарегистрироваться</button>
      </form>

      <hr>

      <!-- Login -->
      <h3>🔑 Вход</h3>
      <form id="login-form">
        <label>Логин</label>
        <input name="username" type="text" required placeholder="Ваш логин">
        <label>Пароль</label>
        <input name="password" type="password" required placeholder="Пароль">
        <button type="submit">Войти</button>
      </form>

      <hr>
    </div>

    <!-- Auth actions (видны только после входа) -->
    <div id="auth-actions" class="hidden">
      <button id="me-btn">👤 Показать /me (защищённый)</button>
      <button id="logout-btn">👋 Выйти</button>
    </div>

    <!-- Chat (виден только после входа) -->
    <div id="chat-section" class="hidden">
      <h3>💬 Чат-комнаты</h3>
      <div class="chat-container">
        <div class="room-input">
          <input id="room-input" value="general" placeholder="Название комнаты">
          <button id="join-btn">Войти</button>
        </div>
        <div id="chat-box">
          <div style="color: #9ca3af; text-align: center; padding: 20px;">
            Войдите в комнату для начала общения
          </div>
        </div>
        <input id="msg-input" placeholder="Введите сообщение..." disabled>
        <button id="send-btn" disabled>Отправить</button>
        <button id="disconnect-btn" class="hidden">Отключиться от чата</button>
      </div>
    </div>

    <div class="output" id="output">Ответ появится здесь...</div>
  </div>

  <script>
    const API = "";
    const output = document.getElementById("output");
    const chatBox = document.getElementById("chat-box");
    const msgInput = document.getElementById("msg-input");
    const sendBtn = document.getElementById("send-btn");
    const authForms = document.getElementById("auth-forms");
    const authActions = document.getElementById("auth-actions");
    const chatSection = document.getElementById("chat-section");
    const disconnectBtn = document.getElementById("disconnect-btn");
    let ws = null;
    let currentRoom = null;

    function show(data, isError = false) {
      output.classList.toggle("error", isError);
      output.textContent = typeof data === "string" ? data : JSON.stringify(data, null, 2);
    }

    // --- Управление видимостью ---
    function showLoggedIn() {
      authForms.classList.add("hidden");
      authActions.classList.remove("hidden");
      chatSection.classList.remove("hidden");
    }

    function showLoggedOut() {
      authForms.classList.remove("hidden");
      authActions.classList.add("hidden");
      chatSection.classList.add("hidden");
    }

    // --- Проверка при загрузке ---
    if (localStorage.getItem("access_token")) {
      showLoggedIn();
    }

    // --- Registration ---
    document.getElementById("register-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const body = { 
        username: fd.get("username"),
        password: fd.get("password") 
      };
      try {
        const res = await fetch(`${API}/register`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });
        const data = await res.json();
        show(data, !res.ok);
      } catch (err) { show("Ошибка: " + err.message, true); }
    });

    // --- Login ---
    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const body = new URLSearchParams();
      body.append("username", fd.get("username"));
      body.append("password", fd.get("password"));
      try {
        const res = await fetch(`${API}/login`, {
          method: "POST",
          body: body
        });
        const data = await res.json();
        if (res.ok && data.access_token) {
          localStorage.setItem("access_token", data.access_token);
          show("✅ Вход выполнен! Токен сохранён.");
          showLoggedIn();
        } else {
          show(data, true);
        }
      } catch (err) { show("Ошибка: " + err.message, true); }
    });

    // --- /me ---
    document.getElementById("me-btn").addEventListener("click", async () => {
      const token = localStorage.getItem("access_token");
      if (!token) return show("Сначала войдите!", true);
      try {
        const res = await fetch(`${API}/me`, {
          headers: { "Authorization": `Bearer ${token}` }
        });
        const data = await res.json();
        show(data, !res.ok);
      } catch (err) { show("Ошибка: " + err.message, true); }
    });

    // --- Logout ---
    document.getElementById("logout-btn").addEventListener("click", () => {
      if (ws) {
        ws.close();
        ws = null;
      }
      currentRoom = null;
      localStorage.removeItem("access_token");
      msgInput.disabled = true;
      sendBtn.disabled = true;
      chatBox.innerHTML = '<div style="color: #9ca3af; text-align: center; padding: 20px;">Войдите в комнату для начала общения</div>';
      disconnectBtn.classList.add("hidden");
      showLoggedOut();
      show("👋 Вы вышли. Токен удалён.");
    });

    // --- Disconnect from chat ---
    disconnectBtn.addEventListener("click", () => {
      if (ws) {
        ws.close();
        ws = null;
      }
      currentRoom = null;
      msgInput.disabled = true;
      sendBtn.disabled = true;
      disconnectBtn.classList.add("hidden");
      chatBox.innerHTML = '<div style="color: #9ca3af; text-align: center; padding: 20px;">Отключено от чата</div>';
      show("❌ Отключено от чата");
    });

    // --- Chat: Join room ---
    document.getElementById("join-btn").addEventListener("click", () => {
      const token = localStorage.getItem("access_token");
      if (!token) return show("Сначала войдите!", true);
      
      const room = document.getElementById("room-input").value.trim();
      if (!room) return show("Введите название комнаты!", true);

      if (ws) {
        const oldWs = ws;
        oldWs.onclose = null;
        oldWs.close();
      }

      currentRoom = room;
      const wsUrl = `ws://${location.host}/ws/${room}?token=${token}`;
      const newWs = new WebSocket(wsUrl);
      ws = newWs;
      
      newWs.onopen = () => {
        if (ws !== newWs) return;
        show(`✅ Подключено к комнате: ${room}`);
        msgInput.disabled = false;
        sendBtn.disabled = false;
        disconnectBtn.classList.remove("hidden");
        msgInput.focus();
      };

      newWs.onmessage = (e) => {
        if (ws !== newWs) return;
        const msg = JSON.parse(e.data);
        if (msg.type === "history") {
          chatBox.innerHTML = "";
          if (msg.data.length === 0) {
            chatBox.innerHTML = '<div style="color: #9ca3af; text-align: center; padding: 20px;">Нет сообщений</div>';
          } else {
            msg.data.forEach(m => appendMsg(m));
          }
        } else if (msg.type === "message") {
          appendMsg(msg.data);
        }
      };

      newWs.onclose = () => {
        if (ws !== newWs) return;
        show("❌ Отключено от чата");
        msgInput.disabled = true;
        sendBtn.disabled = true;
        disconnectBtn.classList.add("hidden");
        ws = null;
      };

      newWs.onerror = (err) => {
        if (ws !== newWs) return;
        show("Ошибка WebSocket", true);
      };
    });

    // --- Chat: Send message ---
    function sendMessage() {
      const text = msgInput.value.trim();
      if (!ws || !text || !currentRoom) return;
      
      ws.send(JSON.stringify({ text: text }));
      msgInput.value = "";
      msgInput.focus();
    }

    sendBtn.addEventListener("click", sendMessage);
    msgInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") sendMessage();
    });

    function appendMsg(m) {
      if (chatBox.children[0]?.style?.textAlign === "center") {
        chatBox.innerHTML = "";
      }
      
      const div = document.createElement("div");
      div.className = "chat-msg";
      const time = m.time ? new Date(m.time).toLocaleTimeString() : "";
      div.innerHTML = `<b>${escapeHtml(m.user)}:</b> ${escapeHtml(m.text)} <small>${time}</small>`;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
